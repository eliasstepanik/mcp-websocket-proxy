name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push supersedes the previous one for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The suite spawns stdio children and binds sockets (see vitest.config.ts);
      # a plain `ubuntu-latest` runner handles that fine.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      # `package-lock.json` is committed, so `npm ci` is the only install path.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Cheap guard that the shipped entry point exists where the Dockerfile and
      # `docker-compose.yml` say it does.
      - name: Check build output
        run: test -f dist/server/main.js && test -f dist/client/main.js
